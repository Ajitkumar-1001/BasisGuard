services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: basisguard
      POSTGRES_PASSWORD: basisguard   # local-only credential; port bound to loopback
      POSTGRES_DB: basisguard_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - basisguard-pg:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basisguard -d basisguard_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  basisguard-pg:
